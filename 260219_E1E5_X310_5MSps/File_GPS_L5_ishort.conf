[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
;internal_fs_sps: Internal signal sampling frequency after the signal conditioning stage [samples per second].
GNSS-SDR.internal_fs_sps=5000000

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/home/data/110.bin
SignalSource.item_type=ishort
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false
SignalSource.sampling_frequency=5000000

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ishort_To_Complex

;######### INPUT_FILTER CONFIG ############
InputFilter.implementation=Pass_Through
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex

;######### RESAMPLER CONFIG ############
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex
Resampler.sample_freq_in=5000000
Resampler.sample_freq_out=5000000
Resampler.dump=false
Resampler.dump_filename=../data/resampler.dat


;######### CHANNELS GLOBAL CONFIG ############
Channels_L5.count=12
Channels.in_acquisition=1
Channel.signal=L5

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_L5.implementation=GPS_L5i_PCPS_Acquisition
Acquisition_L5.item_type=gr_complex
Acquisition_L5.doppler_max=6000
Acquisition_L5.doppler_step=20

;######### TRACKING GLOBAL CONFIG ############
Tracking_L5.implementation=GPS_L5_DLL_PLL_Tracking

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_L5.implementation=GPS_L5_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_filename=gpsL5.dat

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.averaging_depth=100
PVT.flag_averaging=true
PVT.output_rate_ms=30000
PVT.display_rate_ms=500
PVT.trop_model=Saastamoinen
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.rtcm_dump_devname=/dev/pts/1
PVT.rtcm_tcp_port=2101
PVT.rtcm_MT1019_rate_ms=12500
PVT.rtcm_MT1045_rate_ms=12500
PVT.rtcm_MT1097_rate_ms=1000
PVT.rtcm_MT1077_rate_ms=1000
PVT.rinex_version=3
PVT.rinex_output_enabled=true
PVT.rinex_name=gpsL5
PVT.rinexobs_rate_ms=30000
